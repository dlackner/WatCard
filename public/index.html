<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wat Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Welcome / Login page -->
  <div id="welcome" class="welcome-page">
    <button class="theme-toggle-btn" id="theme-toggle-welcome">Dark</button>
    <h1>Wat Card</h1>
    <form id="name-form">
      <input type="text" id="name-input" placeholder="Your name" autofocus />
      <button type="submit">Go</button>
    </form>
    <button class="secondary skip-btn" id="skip-btn">Skip &mdash; use without saving</button>
  </div>

  <!-- Main app (hidden until login/skip) -->
  <div id="app" class="container hidden">
    <header>
      <button class="theme-toggle-btn" id="theme-toggle-app">Dark</button>
      <h1>Wat Card</h1>
      <p class="subtitle" id="greeting">Find the best card to use for every purchase</p>
    </header>

    <main>
      <!-- Card input section -->
      <section class="input-section">
        <label for="card-input">Build your Wallet</label>
        <div class="input-row">
          <div class="autocomplete-wrapper">
            <input
              type="text"
              id="card-input"
              placeholder="e.g. Chase Sapphire, Amex Gold..."
              autocomplete="off"
            />
            <ul id="suggestions" class="suggestions"></ul>
          </div>
          <button id="add-btn" class="btn btn-secondary">Add</button>
        </div>

        <div id="card-tags" class="card-tags"></div>
      </section>

      <!-- Visual wallet -->
      <section id="wallet" class="wallet hidden">
        <h2>Your Wallet</h2>
        <div id="wallet-cards" class="wallet-cards"></div>
        <button id="optimize-btn" class="btn btn-primary">
          Optimize My Wallet
        </button>
      </section>

      <!-- Results section -->
      <section id="results" class="results hidden">
        <div class="results-header">
          <h2>Your Optimized Wallet</h2>
          <button id="export-btn" class="btn-export">
            <span class="export-icon">[>_]</span> EXPORT
          </button>
        </div>
        <p class="results-subtitle" id="results-subtitle"></p>

        <!-- Top pick summary -->
        <div id="top-picks" class="top-picks"></div>

        <!-- Grouped by card -->
        <div id="card-groups" class="card-groups"></div>

        <!-- Fallback card -->
        <div id="fallback" class="fallback-card hidden"></div>
      </section>
    </main>

    <footer></footer>
  </div><!-- end #app -->

  <script src="/app.js"></script>
</body>
</html>
